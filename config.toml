[paths]
scripts = "./scripts"
notes = "./notes"
projects = "./projects"

[ui]
theme = "textual-dark"
todo_startup_notification = true

[scripts]
timeout = 3
depth = 1

[[logs]]
name = "Application_01_logs"
location = "./logs/application_01_logs"

[[logs]]
name = "Application 02"
location = "./logs/application_02_logs"

[[services]]
name = "Healthy Endpoint Example"
type = "http"
target = "https://httpbin.org/status/200"
interval = 5

[[services]]
name = "Failing Endpoint Example"
type = "http"
target = "https://httpbin.org/status/500"
interval = 5
