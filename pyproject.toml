[project]
name = "toolbox"
version = "0.1.0"
description = "TUI to centralize scripts I run on a daily basis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "tomlkit>=0.15.1",
]

[project.scripts]
toolboxtui = "main:main"