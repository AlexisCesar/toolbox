name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups

      - name: Build application
        run: uv run python -m compileall -q main.py src

      - name: Run tests
        run: uv run pytest
